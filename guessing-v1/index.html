
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猜數字遊戲｜練習一</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f4ef;
      color: #26352e;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .game-card {
      width: 100%;
      max-width: 480px;
      padding: 36px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(35, 55, 44, 0.10);
    }

    .tag {
      color: #668674;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      margin: 12px 0;
      font-size: 30px;
    }

    .description {
      color: #68766e;
      line-height: 1.8;
      font-size: 14px;
    }

    .rule-box {
      margin: 24px 0;
      padding: 16px;
      background: #f3f6f1;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.9;
    }

    .rule-box strong {
      color: #426b52;
    }

    input {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 1px solid #cbd6cc;
      border-radius: 10px;
      font-size: 22px;
      letter-spacing: 8px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #668674;
      box-shadow: 0 0 0 3px rgba(102, 134, 116, 0.15);
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #426b52;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #31533e;
    }

    button:disabled {
      background: #aab8ad;
      cursor: not-allowed;
    }

    .restart-button {
      background: #e8eee8;
      color: #426b52;
    }

    .restart-button:hover {
      background: #dce7dd;
    }

    .debug-area {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e5ebe5;
    }

    .debug-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .debug-answer {
      margin-top: 12px;
      padding: 12px;
      background: #fff6e9;
      border-radius: 8px;
      color: #805b2e;
      text-align: center;
      font-weight: bold;
    }

    .feedback {
      min-height: 55px;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #f3f6f1;
      text-align: center;
      line-height: 1.7;
      color: #426b52;
    }

    .feedback.error {
      background: #fff0ed;
      color: #a34c3d;
    }

    .feedback.success {
      background: #eaf5eb;
      color: #2f7040;
    }

    .footer {
      margin-top: 24px;
      color: #9aa59d;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .game-card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="game-card">
    <div class="tag">NUMBER GUESSING GAME / 01</div>

    <h1>四位數猜謎</h1>

    <p class="description">
      猜出電腦設定的四位數字！<br>
      根據每次猜測的結果，慢慢找出正確答案。
    </p>

    <div class="rule-box">
      <strong>遊戲規則</strong><br>
      ・答案由 0～9 組成，共四個不同數字。<br>
      ・數字與位置都正確：1A。<br>
      ・數字正確但位置錯誤：1B。<br>
      ・猜中答案即可獲勝！
    </div>

    <label for="guessInput">輸入四位數字</label>
    <input
      id="guessInput"
      type="text"
      inputmode="numeric"
      maxlength="4"
      placeholder="例如：0123"
      autocomplete="off"
    >

    <button id="guessButton">猜看看</button>

    <div id="feedback" class="feedback" aria-live="polite">
      遊戲開始！請輸入四個不重複的數字。
    </div>

    <div class="debug-area">
      <label class="debug-label">
        <input
          id="debugToggle"
          type="checkbox"
          style="width: auto; margin: 0;"
        >
        開啟 Debug 除錯模式
      </label>

      <div id="debugAnswer" class="debug-answer" hidden>
        正確答案：
      </div>
    </div>

    <button id="restartButton" class="restart-button">
      重新開始
    </button>

    <div class="footer">
      Practice 01 · Four-digit Bulls and Cows
    </div>
  </main>

  <script>
    // ===== 取得 HTML 元素 =====

    const guessInput = document.getElementById("guessInput");
    const guessButton = document.getElementById("guessButton");
    const feedback = document.getElementById("feedback");
    const restartButton = document.getElementById("restartButton");
    const debugToggle = document.getElementById("debugToggle");
    const debugAnswer = document.getElementById("debugAnswer");

    // ===== 遊戲資料 =====

    let answer = "";
    let gameOver = false;

    // ===== 產生四位數且不重複的答案 =====

    function generateAnswer() {
      const digits = [];

      while (digits.length < 4) {
        const digit = Math.floor(Math.random() * 10).toString();

        if (!digits.includes(digit)) {
          digits.push(digit);
        }
      }

      return digits.join("");
    }

    // ===== 檢查玩家輸入 =====

    function validateGuess(guess) {
      if (guess === "") {
        return "請先輸入數字！";
      }

      if (!/^\d{4}$/.test(guess)) {
        return "請輸入完整的四位數字！";
      }

      if (new Set(guess).size !== 4) {
        return "數字不能重複，請重新輸入！";
      }

      return null;
    }

    // ===== 比較答案並計算 A、B =====

    function compareGuess(guess) {
      let A = 0;
      let B = 0;

      for (let i = 0; i < 4; i++) {
        if (guess[i] === answer[i]) {
          A++;
        } else if (answer.includes(guess[i])) {
          B++;
        }
      }

      return { A, B };
    }

    // ===== 顯示遊戲訊息 =====

    function showMessage(message, type = "") {
      feedback.textContent = message;
      feedback.className = "feedback";

      if (type) {
        feedback.classList.add(type);
      }
    }

    // ===== 顯示或隱藏 Debug 答案 =====

    function updateDebugAnswer() {
      if (debugToggle.checked) {
        debugAnswer.hidden = false;
        debugAnswer.textContent = "正確答案：" + answer;
      } else {
        debugAnswer.hidden = true;
      }
    }

    // ===== 玩家送出猜測 =====

    function submitGuess() {
      if (gameOver) {
        return;
      }

      const guess = guessInput.value.trim();

      const errorMessage = validateGuess(guess);

      if (errorMessage) {
        showMessage(errorMessage, "error");
        return;
      }

      const result = compareGuess(guess);

      if (result.A === 4) {
        showMessage("🎉 恭喜你！答案正確，遊戲勝利！", "success");
        gameOver = true;
        guessButton.disabled = true;
        guessInput.disabled = true;
      } else {
        showMessage(
          `目前結果：${result.A}A ${result.B}B，繼續加油！`
        );
      }

      guessInput.value = "";
      guessInput.focus();
    }

    // ===== 開始新遊戲 =====

    function newGame() {
      answer = generateAnswer();
      gameOver = false;

      guessInput.value = "";
      guessInput.disabled = false;
      guessButton.disabled = false;

      debugToggle.checked = false;
      updateDebugAnswer();

      showMessage("新遊戲開始！請猜猜看。");
    }

    // ===== 按鈕事件 =====

    guessButton.addEventListener("click", submitGuess);

    guessInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        submitGuess();
      }
    });

    restartButton.addEventListener("click", newGame);

    debugToggle.addEventListener("change", updateDebugAnswer);

    // ===== 初始化遊戲 =====

    newGame();
  </script>
</body>
</html>
