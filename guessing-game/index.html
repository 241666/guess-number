
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猜數字遊戲｜版本總覽</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      background: #101820;
      color: #f4f4f4;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    main {
      max-width: 850px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #a8d5ba;
      margin-bottom: 12px;
    }

    .intro {
      text-align: center;
      color: #c5ced6;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .versions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .card {
      padding: 24px;
      background: #1d2b36;
      border: 1px solid #405564;
      border-radius: 14px;
    }

    .card h2 {
      color: #a8d5ba;
      margin-top: 0;
    }

    .card p {
      color: #d2d9df;
      line-height: 1.7;
      min-height: 55px;
    }

    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: #527b65;
      color: white;
      text-decoration: none;
    }

    a:hover {
      background: #6b9b7e;
    }

    .coming {
      color: #aab4bc;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <h1>猜數字遊戲</h1>

    <p class="intro">
      歡迎來到我的猜數字遊戲！<br>
      這裡記錄了遊戲從第一版到第四版的功能演進。
    </p>

    <section class="versions">
      <article class="card">
        <h2>Version 01</h2>
        <p>四位數猜數字遊戲，學習判斷數字與位置是否正確。</p>
        <a href="./v1/">進入第一版</a>
      </article>

      <article class="card">
        <h2>Version 02</h2>
        <p>延續第一版，加入多回合遊戲與猜測紀錄。</p>
        <a href="./v2/">進入第二版</a>
      </article>

      <article class="card">
        <h2>Version 03</h2>
        <p>第三版功能將依照課堂講義製作。</p>
        <span class="coming">製作中</span>
      </article>

      <article class="card">
        <h2>Version 04</h2>
        <p>第四版功能將依照課堂講義製作。</p>
        <span class="coming">製作中</span>
      </article>
    </section>
  </main>
</body>
</html>
